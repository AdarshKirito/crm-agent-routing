[project]
name = "checkable"
version = "0.1.0"
description = "Release an agent's database answers only when they can be checked, with a certified error rate"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Adarsh Varanasi"},
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
